name: Build and publish

# main  -> rebuilds the site (every v* tag + latest) and deploys it to GitHub Pages
# v*    -> creates a GitHub Release with that version's files attached, then
#          re-runs this workflow on main so the new version gets deployed.
#
# Only main deploys: by default, the github-pages environment only accepts
# deployments from the default branch, and rejects tag runs.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write
  pages: write

concurrency:
  cancel-in-progress: false
  group: pages-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22

      - run: npm ci

      - run: npm run build

      - if: github.ref_type == 'branch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" site/"$GITHUB_REF_NAME"/*
          --generate-notes
          --title "$GITHUB_REF_NAME"
          --verify-tag

      - name: Deploy the new version from main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main

  deploy:
    if: github.ref_type == 'branch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
